<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
  <title>Расширения BrO2</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="extension-menu.css">
  <script src="theme.js"></script>
  <script src="icons.js" defer></script>
  <script src="extension-menu-ui.js" defer></script>
</head>
<body aria-labelledby="title" role="dialog">
  <div class="menu-title">
    <h1 id="title">Расширения</h1>
    <button id="close" class="icon" type="button" title="Закрыть (Esc)" aria-label="Закрыть" data-icon="close"></button>
  </div>
  <ul id="extensions" aria-label="Установленные расширения"></ul>
  <p id="status" role="status" hidden></p>
  <button id="manage" type="button" data-icon="settings">Управление расширениями</button>
</body>
</html>
